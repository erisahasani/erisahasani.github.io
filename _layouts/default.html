<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" type="text/css" href="{{ "/assets/style.css" | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ "/feed.xml" | relative_url }}">
    <meta name="theme-color" content="#000000">
  </head>

  <body>
    <div class="wrapper-container">
      <div class="wrapper-masthead">
        <div class="container">
          <header class="masthead clearfix">
            <div class="site-info">
              <h1 class="site-name"><a href="{{ "/" | relative_url }}">{{ site.name }}</a></h1>
            </div>
            <nav>
              {%- for item in site.nav %}
              <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
              {%- endfor %}
            </nav>
          </header>
        </div>
      </div>

      <div class="wrapper-main">
        <div id="main" role="main" class="container">
          {{ content }}
        </div>
      </div>

      <div class="wrapper-footer">
        <div class="container">
          <footer class="footer">
            {% include footer-links.html %}
          </footer>
        </div>
      </div>
    </div>
  </body>
</html>
