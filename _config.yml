# Site settings
title: Erisa Hasani          # used by jekyll-seo-tag for page titles and metadata
name: Erisa Hasani           # shown in the top bar on non-home pages
author: Erisa Hasani
description: PhD Candidate in Mathematics at UT Austin   # browser tab title and search snippet
header_tagline: PhD Candidate in Mathematics | UT Austin  # shown beside the photo; the | becomes a line break


url: https://www.ehasani.com
baseurl: ""

# Links in the top bar (shown on every page except the home page)
nav:
  - title: Home
    url: /
  - title: Resume
    url: /resume/

# Icons in the footer
footer-links:
  github: erisahasani
  linkedin: erisa-hasani-81107a147
  x: erisaonX

# Build settings
permalink: /:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: expanded

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
